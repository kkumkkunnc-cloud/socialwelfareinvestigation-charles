<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사회복지실천론 기출 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #f4f7f6;
        }
        .quiz-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .option-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            margin-bottom: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            text-align: left;
            font-size: 1rem;
            transition: all 0.2s ease;
            background-color: #fff;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #f8fafc;
            border-color: #94a3b8;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .option-btn.correct {
            background-color: #dcfce7;
            border-color: #22c55e;
            color: #166534;
            font-weight: 600;
        }
        .option-btn.incorrect {
            background-color: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
            font-weight: 600;
        }
        #explanation {
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1.25rem;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        #explanation-title {
            font-weight: 700;
            color: #1e293b;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }
        #next-btn {
            background-color: #3b82f6;
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            transition: background-color 0.2s;
        }
        #next-btn:hover {
            background-color: #2563eb;
        }
        #loading-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            /* height: 300px; */ /* <-- 불필요한 여백을 만드는 원인이 되어 제거했습니다. */
            font-size: 1.2rem;
            color: #475569;
        }
    </style>
</head>
<body class="flex justify-center min-h-screen p-4"> <!-- items-center를 제거하여 상단 정렬로 변경 -->

    <div class="quiz-container w-full max-w-3xl mx-auto p-6 md:p-8">
        <h1 class="text-2xl md:text-3xl font-bold text-center text-gray-800 mb-6">
            사회복지실천론 기출 퀴즈
        </h1>
        
        <div id="quiz-header" class="flex justify-between items-center mb-6 text-gray-600">
            <div class="text-sm font-medium hidden">
                <span id="year-badge" class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full"></span>
            </div>
            <div class="text-lg font-semibold">
                <span id="q-num">1</span> / <span id="q-total">0</span>
            </div>
            <div class="text-lg font-semibold">
                점수: <span id="score" class="text-blue-600">0</span>
            </div>
        </div>

        <div id="quiz-body">
            <!-- 로딩 또는 퀴즈 시작 화면 -->
            <div id="loading-screen">
                <p></p>
            </div>

            <!-- 퀴즈 문제 영역 -->
            <div id="quiz-content" class="hidden">
                <div id="question-text" class="text-xl font-semibold text-gray-900 mb-6 min-h-[60px]">
                    <!-- 문제가 여기에 로드됩니다. -->
                </div>
                
                <div id="options-container">
                    <!-- 선택지가 여기에 로드됩니다. -->
                </div>

                <div id="feedback-container" class="hidden">
                    <div id="explanation">
                        <h3 id="explanation-title">강의 스크립트 기반 해설</h3>
                        <p id="explanation-text"></p>
                    </div>
                </div>

                <div class="mt-8 text-right">
                    <button id="next-btn" class="hidden">다음 문제</button>
                </div>
            </div>

            <!-- 퀴즈 결과 영역 -->
            <div id="results-screen" class="hidden text-center p-8">
                <h2 class="text-2xl font-bold mb-4">퀴즈 완료!</h2>
                <p class="text-xl text-gray-700">
                    총 <span id="final-total">0</span>문제 중 <strong id="final-correct" class="text-blue-600">0</strong>문제를 맞히셨습니다.
                </p>
                <p class="text-2xl font-semibold mt-2">
                    최종 점수: <strong id="final-score" class="text-blue-600">0</strong>점
                </p>
                <button onclick="location.reload()" class="mt-8 px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition-colors">
                    다시 풀기
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 데이터베이스 ---
        // 제공된 PDF(2015-2019)와 스크립트를 기반으로 데이터 추출 및 해설 작성
        const allQuestions = [
            // --- 2016년도 ---
            {
                year: 2016,
                question: "사회복지실천 현장을 1차 현장과 2차 현장으로 분류하는 기준으로 옳은 것은?",
                options: [
                    { text: "설립주체와 재원의 조달방식", isCorrect: false },
                    { text: "서비스 제공방식", isCorrect: false },
                    { text: "주거시설의 제공 여부", isCorrect: false },
                    { text: "기관의 기능 및 목적", isCorrect: true }
                ],
                explanation: "강의 스크립트 5강(05:38)에 따르면, 기관의 주된 '기능 및 목적'이 사회복지 서비스 제공인지 여부에 따라 1차 현장(예: 사회복지관)과 2차 현장(예: 병원, 학교)으로 분류합니다."
            },
            {
                year: 2016,
                question: "캐머만의 사회복지실천 현장을 이해하는 7가지 기준에 포함되지 않는 것은?",
                options: [
                    { text: "개입의 초점", isCorrect: false },
                    { text: "관련법규와 정책", isCorrect: false },
                    { text: "기관의 역사", isCorrect: true },
                    { text: "개입방법과 실무자의 유형", isCorrect: false }
                ],
                explanation: "강의 스크립트 5강(12:04)에서 제시된 7가지 기준은 ①개입의 초점, ②대응방식의 역사성, ③관련 법규와 정책, ④전달체계와 프로그램, ⑤개입방법과 실무자의 유형, ⑥연구/평가/성과, ⑦쟁점/동향/강점입니다. '기관의 역사'는 포함되지 않습니다."
            },
            {
                year: 2016,
                question: "사회복지실천 분야 중 가족복지에 대한 설명으로 옳은 것은?",
                options: [
                    { text: "여성가족부 소관이다.", isCorrect: true },
                    { text: "일반 여성을 위한 사업을 중심으로 운영된다.", isCorrect: false },
                    { text: "장애인과 그 주변 환경의 재활과 사회복귀를 원조한다.", isCorrect: false },
                    { text: "정신보건과 알코올 및 약물 남용 영역으로 나눌 수 있다.", isCorrect: false }
                ],
                explanation: "강의 스크립트 5강(43:54)에 따르면, 가족복지 관련 법률(예: 한부모가족지원법, 다문화가족지원법)은 주로 '여성가족부' 소관입니다."
            },
            {
                year: 2016,
                question: "<보기>는 업무 특성에 따른 사회복지사의 역할에 대한 설명이다. (가), (나)에 들어갈 용어를 차례로 올바르게 짝지은 것은? <보기> 사회복지사는 체계 유지 및 강화 역할을 한다. 우선 (가)로서 서비스 전달에 부정적 영향을 미치는 기관의 구조, 정책, 절차들을 분석해 지적하는 역할을 수행한다. 또한 사회복지사는 (나) 로서 클라이언트에 대한 지식·기술·태도를 발전시키기 위해 다른 전문가들과 함께 서로 돕는 역할을 수행한다.",
                options: [
                    { text: "프로그램 개발자, 자문가", isCorrect: false },
                    { text: "조직분석가, 자문가", isCorrect: true },
                    { text: "상담가, 프로그램 개발자", isCorrect: false },
                    { text: "자문가, 상담가", isCorrect: false }
                ],
                explanation: "강의 스크립트 6강(23:12)에 따르면, (가) '조직분석가'는 서비스에 부정적 영향을 미치는 '기관의 구조, 정책, 절차들을 분석'하는 역할입니다. 6강(25:05)에 따르면, (나) '자문가(consultant)'는 '다른 전문가들과 함께' 클라이언트에 대한 지식과 기술을 발전시키도록 돕는 역할입니다."
            },
            {
                year: 2016,
                question: "사회복지사의 역할을 개입 수준에 따라 분류할 때 미시적 차원의 역할에 해당하지 않는 것은?",
                options: [
                    { text: "행동가의 역할", isCorrect: true },
                    { text: "조력자의 역할", isCorrect: false },
                    { text: "옹호자의 역할", isCorrect: false },
                    { text: "교사의 역할", isCorrect: false }
                ],
                explanation: "강의 스크립트 6강(26:57)에 따르면, '행동가(현장개입가)'의 역할은 거시적 수준(macro-level)에 속합니다. 조력자, 옹호자, 교사 등은 미시적 수준(micro-level)의 역할입니다."
            },
            {
                year: 2016,
                question: "다양한 사회복지실천 현장에서 사회복지사의 역할이 잘못 연결된 것은?",
                options: [
                    { text: "교정사회복지 - 클라이언트가 저지른 비행 행위에 대한 원인을 밝히고 문제의 요인을 제거", isCorrect: false },
                    { text: "의료사회복지 - 노년기를 안정적으로 꾸릴 수 있도록 조력", isCorrect: true },
                    { text: "학교사회복지 - 어려움에 처한 학생을 조기에 발견하고 문제해결을 도움", isCorrect: false },
                    { text: "장애인복지 - 장애인 또는 그 주변 환경과 직접 대면하며 서비스를 제공", isCorrect: false }
                ],
                explanation: "강의 스크립트 5강(37:12)에 따르면, '의료사회복지'는 환자의 질병 치료, 회복, 사회복귀 기능 등을 지원하는 역할입니다. '노년기를 안정적으로 꾸릴 수 있도록 조력'하는 것은 주로 '노인복지' 분야의 역할입니다(5강 33:49)."
            },
            {
                year: 2016,
                question: "사회복지실천의 통합적 접근에 대한 설명으로 가장 적합한 것은?",
                options: [
                    { text: "개인적 병리나 과거 경험 진단을 통해 문제를 해석", isCorrect: false },
                    { text: "사회복지실천 과정을 단편적 문제해결 과정으로 인식", isCorrect: false },
                    { text: "문제에 대해 광범위하고 포괄적으로 접근", isCorrect: true },
                    { text: "프로이트의 정신분석학을 적용", isCorrect: false }
                ],
                explanation: "강의 스크립트 7강(08:52)에서 통합적 접근은 전통적 접근과 달리 '문제에 대해 광범위하고 포괄적으로 접근'하며, 개인, 가족, 지역사회 등 다양한 수준의 체계에 개입합니다."
            },
            {
                year: 2016,
                question: "가족체계의 구성개념 중 <보기>의 설명에 해당하는 것은? <보기> ·가족 내 한 성원의 변화는 다른 성원을 반응하게 하는 자극이 되고 이 자극은 다른 가족에게 영향을 미치게 되어 전체에 영향을 주게 됨. ·'왜'보다는 '무엇을 하느냐'에 초점을 두어야 함.",
                options: [
                    { text: "환류고리", isCorrect: false },
                    { text: "순환적 인과성", isCorrect: true },
                    { text: "가족항상성", isCorrect: false },
                    { text: "하위체계", isCorrect: false }
                ],
                explanation: "강의 스크립트 7강(21:17)에서 '순환적 인과성'은 가족 내 한 성원의 변화가 다른 성원에게 영향을 미치고, 그 영향이 다시 처음 성원에게 순환적으로 영향을 미치는 현상을 설명합니다."
            },
            {
                year: 2016,
                question: "치료집단의 유형 중 퇴직준비집단, 잠재력 개발집단 등 자기인식 증진과 사고의 변화를 목적으로 하는 집단은?",
                options: [
                    { text: "지지집단", isCorrect: false },
                    { text: "교육집단", isCorrect: false },
                    { text: "성장집단", isCorrect: true },
                    { text: "사회화집단", isCorrect: false }
                ],
                explanation: "강의 스크립트 7강(30:38)에 따르면, '성장집단'은 구성원의 잠재력 개발, 자기인식 증진, 사고방식 변화 등을 목적으로 합니다."
            },
            {
                year: 2016,
                question: "<보기>에서 설명하는 통합적 사회복지실천 모델은? <보기> ·통합적 사회복지실천의 대표적인 모델로서 사회체계, 사회학습 등의 접근법을 준거틀로 삼은 모델 ·사회학습에 관한 사회복지사의 기능과 역할에 많은 비중 ·종합적인 과정 모델을 다양한 표적 체계인 개인, 가족, 집단, 지역사회 등에서 구체화된 단계와 연결하여 설명",
                options: [
                    { text: "단일화 모델", isCorrect: true },

                ],
                explanation: "강의 스크립트 7강(41:31)에서 골드스틴(Goldstein)의 '단일화 모델'은 사회체계이론, 사회학습이론 등을 준거틀로 삼아 다양한 표적 체계에 접근하는 통합적 모델이라고 설명합니다."
            },
            {
                year: 2016,

                options: [
                    { text: "적절한 권위 및 권한", isCorrect: false },

                options: [
                    { text: "의도적 감정표현", isCorrect: false },

                options: [

        // --- 2. 퀴즈 어플리케이션 로직 ---
        let uniqueQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        const loadingScreen = document.getElementById('loading-screen');
        const quizContent = document.getElementById('quiz-content');
        const resultsScreen = document.getElementById('results-screen');
        
        const qNum = document.getElementById('q-num');
        const qTotal = document.getElementById('q-total');
        const scoreDisplay = document.getElementById('score');
        const yearBadge = document.getElementById('year-badge');
        
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const feedbackContainer = document.getElementById('feedback-container');
        const explanationText = document.getElementById('explanation-text');
        const nextBtn = document.getElementById('next-btn');

        // DOM 콘텐츠 로드 완료 시 퀴즈 초기화
        document.addEventListener('DOMContentLoaded', () => {
            loadQuiz();
        });

        /**
         * 텍스트 정규화 (중복 제거용)
         * @param {string} text - 정규화할 문자열
         * @returns {string} - 공백, 특수문자, <보기> 태그 등이 제거된 문자열
         */
        function normalizeText(text) {
            if (typeof text !== 'string') return '';
            return text.replace(/[\s\.,\?!<보기>\[\]\(\)]/g, '') // 공백, 구두점, 태그 제거
                       .replace(/<br>/g, '') // <br> 태그 제거
                       .toLowerCase(); // 소문자화
        }

        /**
         * 퀴즈 로드 및 초기화
         * 1. 문제 정규화 및 중복 제거 (최신 연도 우선 보존)
         * 2. 퀴즈 UI 표시
         */
        function loadQuiz() {
            // 연도 내림차순 정렬 (최신 연도 우선)
            allQuestions.sort((a, b) => b.year - a.year);

            const seenQuestions = new Set();
            uniqueQuestions = allQuestions.filter(q => {
                // 질문 텍스트와 옵션 텍스트를 조합하여 정규화
                const optionsText = q.options.map(opt => normalizeText(opt.text)).sort().join('');
                const normalizedQ = normalizeText(q.question) + optionsText;
                
                if (seenQuestions.has(normalizedQ)) {
                    return false; // 중복이므로 제거
                } else {
                    seenQuestions.add(normalizedQ);
                    return true; // 고유하므로 포함
                }
            });

            // 연도 오름차순으로 다시 정렬 (오래된 문제부터 풀도록)
            uniqueQuestions.sort((a, b) => a.year - b.year);

            // 로딩 화면 숨기고 퀴즈 내용 표시
            loadingScreen.classList.add('hidden');
            quizContent.classList.remove('hidden');
            
            qTotal.textContent = uniqueQuestions.length;
            
            displayQuestion();
        }

        /**
         * 현재 인덱스의 질문을 화면에 표시
         */
        function displayQuestion() {
            // 피드백 및 다음 버튼 초기화
            feedbackContainer.classList.add('hidden');
            nextBtn.classList.add('hidden');
            optionsContainer.innerHTML = ''; // 이전 선택지 삭제

            if (currentQuestionIndex < uniqueQuestions.length) {
                const q = uniqueQuestions[currentQuestionIndex];
                
                questionText.innerHTML = `${currentQuestionIndex + 1}. ${q.question}`.replace(/<보기>/g, '<div class="mt-2 p-3 bg-gray-100 border border-gray-300 rounded-md text-base font-normal">').replace(/<\/보기>/g, '</div>');
                qNum.textContent = currentQuestionIndex + 1;
                scoreDisplay.textContent = score;
                yearBadge.textContent = `${q.year}년도`;

                // 선택지 버튼 생성
                q.options.forEach((option, index) => {
                    const button = document.createElement('button');
                    button.innerHTML = `(${index + 1}) ${option.text}`;
                    button.classList.add('option-btn');
                    button.dataset.correct = option.isCorrect;
                    
                    button.addEventListener('click', () => selectOption(button, option.isCorrect, q));
                    
                    optionsContainer.appendChild(button);
                });

            } else {
                // 퀴즈 종료
                showResults();
            }
        }

        /**
         * 선택지 클릭 시 처리
         * @param {HTMLButtonElement} selectedButton - 클릭된 버튼
         * @param {boolean} isCorrect - 정답 여부
         * @param {object} questionData - 현재 질문 객체 (해설 및 정답 포함)
         */
        function selectOption(selectedButton, isCorrect, questionData) {
            // 모든 버튼 비활성화
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                // 정답 버튼 표시
                if (btn.dataset.correct === 'true') {
                    btn.classList.add('correct');
                }
            });

            // 클릭한 버튼 채점
            if (isCorrect) {
                selectedButton.classList.add('correct');
                score++;
                scoreDisplay.textContent = score; // 점수 즉시 업데이트
            } else {
                selectedButton.classList.add('incorrect');
            }

            // 정답 찾기
            const correctOption = questionData.options.find(opt => opt.isCorrect);
            const correctOptionIndex = questionData.options.indexOf(correctOption);
            const correctAnswerText = `<strong class='text-blue-600'>정답: ${correctOptionIndex + 1}번 (${correctOption.text})</strong><br><br>`;

            // 해설 표시
            explanationText.innerHTML = correctAnswerText + questionData.explanation;
            feedbackContainer.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
        }

        /**
         * '다음 문제' 버튼 클릭 리스너
         */
        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            displayQuestion();
        });

        /**
         * 퀴즈 결과 화면 표시
         */
        function showResults() {
            quizContent.classList.add('hidden');
            resultsScreen.classList.remove('hidden');

            const total = uniqueQuestions.length;
            const percentage = total > 0 ? Math.round((score / total) * 100) : 0;

            document.getElementById('final-total').textContent = total;
            document.getElementById('final-correct').textContent = score;
            document.getElementById('final-score').textContent = percentage;
        }

    </script>
